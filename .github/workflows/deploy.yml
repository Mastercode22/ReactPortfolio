name: Deploy Portfolio to InfinityFree

on:
  push:
    branches: [ main, master ]

jobs:
  web-deploy:
    name: Build & Deploy via LFTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build Production React App
        working-directory: ./frontend
        run: npm run build

      - name: 🚀 Deploy to InfinityFree via LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" "${FTP_SERVER}" << 'EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:timeout 15
          set net:max-retries 3
          mirror -R --verbose --exclude-glob .git* ./frontend/dist /htdocs
          mirror -R --verbose --exclude-glob .git* ./backend /htdocs/backend
          quit
          EOF
