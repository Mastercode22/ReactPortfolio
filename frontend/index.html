<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- Immediate Theme Initialization to prevent theme flash before JS loads -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Rapid Render | Full-Stack Developer & UI/UX Engineer | Rapid Render</title>
    <meta name="description" content="Rapid Render is a Full-Stack Developer and UI/UX Engineer specializing in React, Node.js, and premium web experiences. Available for selective client projects." />
    <meta name="keywords" content="full stack developer, React developer, UI UX designer, web engineer, portfolio, Rapid Render, Rapid Render, neumorphism, glassmorphism" />
    <meta name="author" content="Rapid Render" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://rapidrender.dev/" />

    <!-- Open Graph / Social Sharing -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://rapidrender.dev/" />
    <meta name="twitter:title" content="Rapid Render | Full-Stack Developer & UI/UX Engineer" />
    <meta name="twitter:description" content="Premium portfolio blending Neumorphism, Glassmorphism, and high-performance React architecture." />
    <meta name="twitter:image" content="https://rapidrender.dev/images/ecom.jpg" />

    <!-- Preload Critical Assets (Logo, Hero Image, Hero Video) -->
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/ecom.jpg" fetchpriority="high" />
    <link rel="preload" as="video" href="https://res.cloudinary.com/dhxh1s2h/video/upload/w_480,q_auto/v1786446737/hero-animation.mp4" type="video/mp4" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Embedded Instant Loader Styles & 60 FPS Keyframes -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F6F7FB;
        color: #1B2430;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        transition: opacity 450ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 450ms cubic-bezier(0.16, 1, 0.3, 1),
                    filter 450ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform, filter;
        user-select: none;
      }

      html.dark #app-loader {
        background-color: #090B13;
        color: #F8FAFC;
      }

      html.dark #app-loader .bracket-left,
      html.dark #app-loader .bracket-right {
        stroke: url(#htmlLoaderGradDark) !important;
      }

      #app-loader.loader-exit {
        opacity: 0 !important;
        transform: scale(1.04) !important;
        filter: blur(12px) !important;
        pointer-events: none !important;
      }

      @keyframes loaderSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes loaderSpinRev {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes loaderPulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.25); }
      }

      #app-loader .spin-ring {
        transform-origin: center;
        animation: loaderSpin 14s linear infinite;
      }
      #app-loader .spin-ring-rev {
        transform-origin: center;
        animation: loaderSpinRev 22s linear infinite;
      }
      #app-loader .pulse-emblem {
        transform-origin: center;
        animation: loaderPulse 2.5s ease-in-out infinite;
      }
      #app-loader .logo-img-animated {
        animation: loaderPulse 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 14px rgba(108, 99, 255, 0.5));
      }
      html.dark #app-loader .logo-img-animated {
        filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.7));
      }

      #app-loader .logo-glow-aura {
        background: radial-gradient(circle, rgba(108, 99, 255, 0.25) 0%, transparent 70%);
      }
      html.dark #app-loader .logo-glow-aura {
        background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, transparent 70%);
      }

      #app-loader .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #6C63FF;
        display: inline-block;
        animation: dotPulse 1.5s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(108, 99, 255, 0.6);
      }
      html.dark #app-loader .status-dot {
        background-color: #F59E0B;
        box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
      }

      #app-loader .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
      }

      #app-loader .loader-status {
        display: flex;
        align-items: center;
        gap: 0.625rem;
        letter-spacing: 0.25em;
        font-size: 0.6875rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #64748B;
      }
      html.dark #app-loader .loader-status {
        color: #94A3B8;
      }

      #app-loader .loader-svg-wrapper {
        position: relative;
        width: 170px;
        height: 170px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body class="bg-[#F6F7FB] dark:bg-[#090B13] text-[#1B2430] dark:text-[#F8FAFC] font-sans antialiased transition-colors duration-300 overflow-x-hidden selection:bg-[#6C63FF]/20 selection:text-[#6C63FF]">
    
    <!-- Phase 1 — Instant HTML Splash Loader with User Logo -->
    <div id="app-loader" aria-label="Initializing Rapid Render Architecture" role="status">
      <div class="loader-content">
        <div class="loader-svg-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="brand-loader-svg" width="170" height="170">
            <defs>
              <!-- Light Mode Blue Gradient -->
              <linearGradient id="htmlLoaderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6C63FF" />
                <stop offset="50%" stop-color="#7C5CFF" />
                <stop offset="100%" stop-color="#5FA8FF" />
              </linearGradient>
              <!-- Dark Mode Luxury Gold Gradient -->
              <linearGradient id="htmlLoaderGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F59E0B" />
                <stop offset="50%" stop-color="#FBBF24" />
                <stop offset="100%" stop-color="#D97706" />
              </linearGradient>
            </defs>

            <!-- Outer Rotating Blueprint Ring -->
            <circle cx="100" cy="100" r="88" class="spin-ring" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="8 6 16 6" opacity="0.35" />
            
            <!-- Blueprint Compass Ticks -->
            <circle cx="100" cy="100" r="76" class="spin-ring-rev" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1 11" opacity="0.25" />

            <!-- Inner Reference Ring -->
            <circle cx="100" cy="100" r="64" fill="none" stroke="currentColor" stroke-opacity="0.15" stroke-width="1" />

            <!-- Developer Brackets < > Framing Logo -->
            <g class="pulse-emblem">
              <!-- Left Bracket < -->
              <path d="M 44 80 L 28 100 L 44 120" fill="none" stroke="url(#htmlLoaderGradLight)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="bracket-left" />
              
              <!-- Right Bracket > -->
              <path d="M 156 80 L 172 100 L 156 120" fill="none" stroke="url(#htmlLoaderGradLight)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="bracket-right" />
            </g>
          </svg>

          <!-- User's Official Logo Image in Center -->
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;">
            <div class="logo-glow-aura" style="position: absolute; width: 75px; height: 75px; border-radius: 50%;"></div>
            <img src="/logo.png" alt="Rapid Render Logo" class="logo-img-animated" style="position: relative; z-index: 10; max-width: 80px; max-height: 80px; width: auto; height: auto; object-fit: contain;" />
          </div>
        </div>

        <!-- Luxury Status Text -->
        <div class="loader-status">
          <span class="status-dot"></span>
          <span class="status-text">INITIALIZING ARCHITECTURE</span>
        </div>
      </div>
    </div>

    <div id="root"></div>
